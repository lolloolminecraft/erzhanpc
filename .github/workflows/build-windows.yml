name: Build Erzhan PC Windows Installer

on:
  push:
    branches:
      - build/erzhanpc-2.3.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Extract source bundle
        shell: pwsh
        run: Expand-Archive -LiteralPath ErzhanPC_2.3.4_Inno_Source.zip -DestinationPath build -Force
      - name: Build application and installer
        shell: cmd
        run: call build\InstallerWin\Build_Installer.cmd
      - name: Verify tunnel client header support
        shell: pwsh
        run: |
          $client = 'build\ErzhanPC\dist\ErzhanPC\tunnel-client.exe'
          $helpText = & $client run --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'mcp.extra-headers' -or $helpText -notmatch 'mcp.discovery-extra-headers') {
            throw 'The bundled tunnel client does not advertise required MCP header flags.'
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ErzhanPC-Setup-2.3.4-Windows
          path: build/InstallerWin/output/ErzhanPC_Setup_2.3.4.exe
          if-no-files-found: error
          retention-days: 14
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path build\ErzhanPC).Path
          & build\ErzhanPC\.venv\Scripts\python.exe -m unittest discover -s build\ErzhanPC\tests
